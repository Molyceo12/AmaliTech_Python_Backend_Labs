# Pre-commit hooks for the shared labs repo.
# Python hooks only check the labs listed below, so other labs are not affected.
repos:
  # Basic file checks: whitespace, final newline, valid YAML, no big files.
  # They run with "python -m" from the log analyzer's .venv (pre-commit-hooks is
  # a dev dependency there): Windows Application Control blocks the .exe files
  # in pre-commit's own environment for these hooks.
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
        files: ^(ADVANCED_PYTHON/(student-grade-analytics|log-file-analyzer)|DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline)/
      - id: end-of-file-fixer
        name: fix end of files
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
        files: ^(ADVANCED_PYTHON/(student-grade-analytics|log-file-analyzer)|DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline)/
      - id: check-yaml
        name: check yaml
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-added-large-files
        name: check for added large files
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m pre_commit_hooks.check_added_large_files
        language: system

  # Ruff: lints and auto-fixes (imports, unused code, common bugs)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(ADVANCED_PYTHON/(student-grade-analytics|log-file-analyzer)|DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline)/

  # Black, pylint and mypy run with the lab's .venv python (python -m poetry install):
  # pre-commit's separate environments for them are blocked by Windows
  # Application Control, and mypy/pylint also need the lab's packages (matplotlib).
  - repo: local
    hooks:
      # Black: formats the code (PEP 8 style)
      - id: black
        name: black
        entry: ADVANCED_PYTHON\\student-grade-analytics\\.venv\\Scripts\\python.exe -m black
        language: system
        types: [python]
        files: ^ADVANCED_PYTHON/student-grade-analytics/
      # Pylint: deeper code-quality checks
      - id: pylint
        name: pylint
        entry: ADVANCED_PYTHON\\student-grade-analytics\\.venv\\Scripts\\python.exe -m pylint --rcfile=ADVANCED_PYTHON/student-grade-analytics/pyproject.toml
        language: system
        types: [python]
        files: ^ADVANCED_PYTHON/student-grade-analytics/(src|tests)/
      # Mypy: checks the type hints (strict)
      - id: mypy
        name: mypy
        entry: ADVANCED_PYTHON\\student-grade-analytics\\.venv\\Scripts\\python.exe -m mypy --config-file=ADVANCED_PYTHON/student-grade-analytics/pyproject.toml
        language: system
        types: [python]
        files: ^ADVANCED_PYTHON/student-grade-analytics/(src|tests)/

  # Log file analyzer: same three hooks, run with that lab's own .venv and config.
  - repo: local
    hooks:
      - id: black-log-analyzer
        name: black (log analyzer)
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m black
        language: system
        types: [python]
        files: ^ADVANCED_PYTHON/log-file-analyzer/
      - id: pylint-log-analyzer
        name: pylint (log analyzer)
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m pylint --rcfile=ADVANCED_PYTHON/log-file-analyzer/pyproject.toml
        language: system
        types: [python]
        files: ^ADVANCED_PYTHON/log-file-analyzer/(src|tests|scripts)/
      - id: mypy-log-analyzer
        name: mypy (log analyzer)
        entry: ADVANCED_PYTHON\\log-file-analyzer\\.venv\\Scripts\\python.exe -m mypy --config-file=ADVANCED_PYTHON/log-file-analyzer/pyproject.toml
        language: system
        types: [python]
        files: ^ADVANCED_PYTHON/log-file-analyzer/(src|tests|scripts)/

  # E-commerce pipeline: same three hooks, run with that lab's own .venv and config.
  - repo: local
    hooks:
      - id: black-ecommerce
        name: black (ecommerce pipeline)
        entry: DATABASE_FUNDAMENTALS\\ecommerce-analytics-pipeline\\.venv\\Scripts\\python.exe -m black
        language: system
        types: [python]
        files: ^DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline/
      - id: pylint-ecommerce
        name: pylint (ecommerce pipeline)
        entry: DATABASE_FUNDAMENTALS\\ecommerce-analytics-pipeline\\.venv\\Scripts\\python.exe -m pylint --rcfile=DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline/pyproject.toml
        language: system
        types: [python]
        files: ^DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline/(src|tests)/
      - id: mypy-ecommerce
        name: mypy (ecommerce pipeline)
        entry: DATABASE_FUNDAMENTALS\\ecommerce-analytics-pipeline\\.venv\\Scripts\\python.exe -m mypy --config-file=DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline/pyproject.toml
        language: system
        types: [python]
        files: ^DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline/(src|tests)/
