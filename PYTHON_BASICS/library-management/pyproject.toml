[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[project]
name = "library-management"
version = "0.1.0"
description = "A Python CLI application for managing a library's books, members, and loans."
authors = [
    {name = "Maurice"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
