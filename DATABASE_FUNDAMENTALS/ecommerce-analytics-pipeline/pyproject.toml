[project]
name = "ecommerce-analytics-pipeline"
version = "0.1.0"
description = "E-commerce analytics data pipeline with PostgreSQL, Redis and MongoDB."
authors = [
    {name = "Irimaso Maurice",email = "irimasomaurice@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pymongo (>=4.19.0,<5.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]

[project.scripts]
ecommerce = "ecommerce_pipeline.cli:main"

[tool.poetry]
packages = [{include = "ecommerce_pipeline", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-mock (>=3.17.0,<4.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pre-commit-hooks (>=6.0.0,<7.0.0)",
    "types-psycopg2 (>=2.9.21.20261008,<3.0.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pylint.main]
py-version = "3.11"
# Works when run from the lab folder or from the repo root (pre-commit).
init-hook = "import sys; sys.path[:0] = ['src', 'DATABASE_FUNDAMENTALS/ecommerce-analytics-pipeline/src']"

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pylint.design]
min-public-methods = 1
# Settings holds one field per .env variable (8).
max-attributes = 8

[tool.mypy]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["ecommerce_pipeline"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == .__main__.:']
