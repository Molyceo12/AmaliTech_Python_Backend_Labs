# web (Django + Gunicorn) and db (PostgreSQL). Values come from .env.
services:
  db:
    image: postgres:16
    # Start again after a crash or a Docker restart.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 5433 on your PC (for pgAdmin), so a local PostgreSQL can keep 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Set here, not in .env, so a local runserver keeps using SQLite.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn url_shortener.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    # Keep logs/app.log when the container is rebuilt.
    volumes:
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  # Seeders on demand: `docker compose run --rm seed`. Dev settings (DEBUG on)
  # only for this one-off container; the "tools" profile keeps it out of `up`.
  seed:
    build: .
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SETTINGS_MODULE: url_shortener.settings.dev
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_dev"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_logs:
