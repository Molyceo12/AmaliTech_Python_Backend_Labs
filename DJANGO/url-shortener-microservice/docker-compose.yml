# db (PostgreSQL) plus the app in prod (Gunicorn) or dev (runserver). Values come from .env.
# Pick one: `docker compose --profile prod up` or `docker compose --profile dev up`.

x-app: &app
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy

# Set here, not in .env, so a local runserver keeps using SQLite.
x-database-url: &database-url
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:16
    # Start again after a crash or a Docker restart.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 5433 on your PC (for pgAdmin), so a local PostgreSQL can keep 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      <<: *database-url
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn url_shortener.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    # Keep logs/app.log when the container is rebuilt.
    volumes:
      - app_logs:/app/logs

  # Same port as web, so run one of them at a time.
  web-dev:
    <<: *app
    profiles: ["dev"]
    environment:
      <<: *database-url
      DJANGO_SETTINGS_MODULE: url_shortener.settings.dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  # Seeders on demand: `docker compose run --rm seed`.
  seed:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *database-url
      DJANGO_SETTINGS_MODULE: url_shortener.settings.dev
    command: >
      sh -c "python manage.py migrate --noinput && python manage.py seed_dev"

volumes:
  postgres_data:
  app_logs:
