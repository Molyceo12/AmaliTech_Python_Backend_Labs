[project]
name = "url-shortener-microservice"
version = "0.1.0"
description = "URL shortener microservice with Django and Django REST Framework."
authors = [
    {name = "Irimaso Maurice",email = "irimasomaurice@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["django (>=5.2,<6.0)", "djangorestframework (>=3.18.3,<4.0.0)"]

[tool.poetry]
# A Django service, not a library: Poetry only manages its dependencies.
package-mode = false
