[project]
name = "url-shortener-microservice"
version = "0.1.0"
description = "URL shortener microservice with Django and Django REST Framework."
authors = [
    {name = "Irimaso Maurice",email = "irimasomaurice@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["django (>=5.2,<6.0)", "djangorestframework (>=3.18.3,<4.0.0)", "python-decouple (>=3.8,<4.0)"]

[tool.poetry]
# A Django service, not a library: Poetry only manages its dependencies.
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pylint-django (>=2.8.0,<3.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "django-stubs (>=5.2,<5.3)",
    "djangorestframework-stubs (>=3.16,<3.17)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pre-commit-hooks (>=6.0.0,<7.0.0)"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["url_shortener", "shortener", "accounts"]

[tool.pylint.main]
py-version = "3.11"
load-plugins = ["pylint_django"]
django-settings-module = "url_shortener.settings.dev"
# Works when run from the lab folder or from the repo root (pre-commit).
init-hook = "import sys; sys.path[:0] = ['.', 'DJANGO/url-shortener-microservice']"
ignore = ["migrations"]

[tool.pylint.basic]
no-docstring-rgx = "^(_|test_)"

[tool.pylint.design]
min-public-methods = 1

[tool.mypy]
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "url_shortener.settings.dev"

# python-decouple ships no type hints.
[[tool.mypy.overrides]]
module = ["decouple"]
ignore_missing_imports = true
